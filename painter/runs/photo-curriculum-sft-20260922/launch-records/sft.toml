[data]
type = "sft"
name = "/root/painter/runs/photo-curriculum-sft-20260922/data"
batch_size = 8
micro_batch_size = 1
seq_len = 16384
num_workers = 1
seed = 92022
splits = ["train"]
shuffle = false

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

[val]
interval = 64
eval_on_start = true

[val.data]
type = "sft"
name = "/root/painter/runs/photo-curriculum-sft-20260922/data"
batch_size = 8
micro_batch_size = 1
seq_len = 16384
num_workers = 1
seed = 92022
splits = ["validation"]
shuffle = false

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false

[optim]
type = "adamw"
lr = 1e-05
betas1 = 0.9
betas2 = 0.999
weight_decay = 0.01
