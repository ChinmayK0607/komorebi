# Generated by make_sft_config.py; pinned model revision is recorded in the setup receipt.
max_steps = 1024

[run]
name = "photo-curriculum-sft-20260922"

[deployment]
gpus_per_node = 2
num_train_gpus = 2

[model]
name = "/tmp/photo-curriculum-sft-20260922-models/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
impl = "custom"
compile = "None"
attn = "auto"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
dp_replicate = 2
ac_offloading = "None"
optim_cpu_offload = false

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
