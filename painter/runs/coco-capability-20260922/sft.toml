# Generated by painter/native_painting_eval.py; no credentials or weights.
model = "sft"
num_tasks = 12
num_rollouts = 1
max_concurrent = 8
push = false
output_dir = "/root/painter/coco-capability/eval/sft"

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PAINTER_LOCAL_API_KEY"

[sampling]
temperature = 1.0
max_tokens = 8192
reasoning_effort = "none"
seed = 918200
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[env.taskset]
id = "native_painting"
root = "/root/painter"
manifest = "/root/painter/coco-capability/eval-manifest.json"
expected_count = 12
max_turns = 6
policy_label = "sft"
output_root = "evaluation-rollouts"

[env.agent]
max_turns = 6
# Deliberately omit env.agent.max_output_tokens: current-pin treats that as a
# cumulative per-rollout cap. sampling.max_tokens above is per request.

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

[env.agent.timeout]
rollout = 3600

# The serving endpoint must expose at least this context length.
# native_painting_eval does not add an unknown Prime config key for it.
# context_length = 98304
